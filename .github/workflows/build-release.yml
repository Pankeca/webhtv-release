name: Build Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "版本名，例如 5.6.3（仅用于文件名，版本号以 build.gradle 为准）"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: mobileArm64_v8a
            name: mobile-arm64_v8a
          - task: mobileArmeabi_v7a
            name: mobile-armeabi_v7a
          - task: leanbackArm64_v8a
            name: leanback-arm64_v8a
          - task: leanbackArmeabi_v7a
            name: leanback-armeabi_v7a
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # chaquopy 的 buildPython 固定为 3.10，runner 自带的 3.12 不匹配
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.WEBHTV_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 secrets.WEBHTV_KEYSTORE_BASE64，将使用 debug 签名" >&2
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/webhtv-release.jks"

      - name: Build ${{ matrix.name }}
        env:
          WEBHTV_STORE_FILE: ${{ secrets.WEBHTV_KEYSTORE_BASE64 != '' && format('{0}/webhtv-release.jks', runner.temp) || '' }}
          WEBHTV_KEY_ALIAS: ${{ secrets.WEBHTV_KEY_ALIAS }}
          WEBHTV_STORE_PASSWORD: ${{ secrets.WEBHTV_STORE_PASSWORD }}
          WEBHTV_KEY_PASSWORD: ${{ secrets.WEBHTV_KEY_PASSWORD }}
        run: |
          ./gradlew ":app:assemble${{ matrix.task }}Release" --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -path "*release/*.apk" -exec cp {} "artifacts/${{ matrix.name }}.apk" \;
          ls -lh artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.name }}
          path: artifacts/*.apk
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
